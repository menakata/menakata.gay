<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redtrauma Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
       :root {
    --bg-color: #1a2a3a; /* Deep Navy Blue */
    --card-bg: #b0bfc2;  
    --accent-pink: #d6336c;
    --text-dark: #495057;
}

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* The Main Card */
        .card {
           background-color: #fceef5; /* Soft Shell Pink */
    background-image: repeating-linear-gradient(45deg, rgba(214, 51, 108, 0.05) 0px, rgba(214, 51, 108, 0.05) 2px, transparent 2px, transparent 10px);
    /* This adds a very subtle pink pinstripe instead of triangles */
    padding: 40px;
    border-radius: 40px;
            display: grid;
            grid-template-columns: 1fr 1.5fr; /* Left side smaller than right */
            gap: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            max-width: 600px;
            align-items: center;
        }

        /* Left Side: Avatar and Name */
        .profile-side {
            text-align: center;
        }

        .avatar {
            width: 300px;
            height: 200px;
            border-radius: 30px;
            object-fit: cover;
            border: 4px solid white;
        }

        .name {
            color: var(--accent-pink);
            font-size: 2rem;
            font-weight: 900;
            margin: 15px 0;
            letter-spacing: -1px;
        }

        .commissions-btn {
            background: #e9ecef;
            color: var(--accent-pink);
            padding: 8px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid var(--accent-pink);
            display: inline-block;
        }

        /* Right Side: Links */
        .links-side {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            background: #e9ecef;
            color: var(--text-dark);
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between; /* Text left, icon right */
            align-items: center;
            font-weight: 600;
            border: 2px solid #adb5bd;
            transition: 0.2s;
        }

        .link-btn:hover {
            background: white;
            border-color: var(--accent-pink);
        }

        /* Steam/Discord custom hover colors */
        .link-btn i { font-size: 1.2rem; }

        /* Responsive for Mobile */
        @media (max-width: 500px) {
            .card { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-side">
            <img src="avatar.jpg" alt="Profile" class="avatar">
            <div class="name">menakata</div>
        </div>

        <div class="links-side">
            <a href="https://x.com/menakata1" class="link-btn">Twitter <i class="fab fa-x-twitter"></i></a>
            <a href="https://steamcommunity.com/id/menakata/" class="link-btn">Steam <i class="fab fa-steam"></i></a>
            <a href="https://www.furaffinity.net/user/menakata" class="link-btn">FurAffinity(no'ing there) <i class="fas fa-paw"></i></a>
            <a href="https://discord.com/users/340847032979685378" class="link-btn">Discord <i class="fab fa-discord"></i></a>
            <a href="https://www.tiktok.com/@menakatafr" class="link-btn">TikTok <i class="fab fa-tiktok"></i></a>
        </div>
    </div>

</body>
</html>
